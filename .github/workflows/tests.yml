name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check shell syntax
        run: bash -n install.sh tests/*.sh
      - name: Run tests
        run: ./tests/run.sh
